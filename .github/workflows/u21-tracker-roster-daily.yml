name: U21 Tracker Roster Daily

on:
  schedule:
    # ≈ 09:00 Israel in summer (UTC+3) → 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  roster:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Install Chrome (BB site login fallback)
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
        with:
          install-dependencies: true

      - name: Scrape U21 roster membership
        env:
          BB_PASSWORD: ${{ secrets.BB_PASSWORD }}
          BB_SITE_COOKIES: ${{ secrets.BB_SITE_COOKIES }}
          CURRENT_SEASON: ${{ vars.CURRENT_SEASON || '72' }}
          PUPPETEER_EXECUTABLE_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: node scripts/scrape-u21-tracker-roster.mjs

      - name: Commit roster / events JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/u21-tracker/
          git diff --staged --quiet || (git commit -m "chore: update U21 tracker roster membership" && git push)
